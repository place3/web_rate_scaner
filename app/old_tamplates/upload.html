<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Загрузка документов</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
<header class="bg-white shadow-md p-4 text-center text-xl font-semibold">
  Загрузка документов
</header>

<main class="flex-grow flex flex-col items-center justify-center gap-4">
  <form action="/upload" method="POST" enctype="multipart/form-data" class="flex flex-col items-center gap-4 bg-white p-6 rounded-lg shadow">
    <input type="file" name="files" multiple class="border p-2 rounded w-64" />
    <button type="submit" class="px-6 py-3 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
      Отправить
    </button>
  </form>
  <a href="index.html" class="text-blue-500 hover:underline">← Назад</a>
</main>
</body>
</html>
