<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Загрузка сканов</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/css/upload.css" />
</head>
<body>
  <h1>Загрузка сканов</h1>

  <p>
    <input id="fileInput" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff" />
    <button id="startBtn">Начать загрузку</button>
    <button id="clearBtn">Очистить список</button>
  </p>

  <p>Session ID: <span id="sessionId">—</span></p>

  <div id="files-list">Файлы не выбраны</div>

  <script src="/static/js/upload.js"></script>
</body>
</html>
